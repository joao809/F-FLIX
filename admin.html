<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - StreamApp Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #141414; color: #fff; padding: 20px; }
        h1 { color: #E50914; margin-bottom: 20px; font-size: 1.8rem; text-align: center; }
        form { background: #1f1f1f; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 1rem; }
        textarea { resize: vertical; height: 80px; }
        .btn-tmdb { background-color: #0d253f; color: #01b4e4; border: 1px solid #01b4e4; padding: 10px; font-size: 0.9rem; margin-top: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button[type="submit"] { background-color: #E50914; color: white; border: none; padding: 12px; width: 100%; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button[type="submit"]:hover { background-color: #f40612; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

    <div style="max-width: 600px; margin: 0 auto;">
        <h1>Painel Admin - Cadastrar Mídia</h1>
    </div>

    <form id="admin-form">
        <div class="form-group">
            <label>Título do Filme, Série ou Dorama:</label>
            <input type="text" id="title" required placeholder="Ex: Avatar 2, Round 6...">
            <button type="button" class="btn-tmdb" onclick="buscarNoTMDB()">🔍 Buscar Capas e Sinopse Automática (TMDB)</button>
        </div>

        <div class="form-group">
            <label>Tipo:</label>
            <select id="type">
                <option value="movie">Filme</option>
                <option value="series">Série</option>
                <option value="anime">Anime</option>
                <option value="cartoon">Desenho / Animação</option>
                <option value="dorama">Dorama</option>
            </select>
        </div>

        <div class="form-group">
            <label>Categoria:</label>
            <select id="category">
                <option value="terror">Terror</option>
                <option value="aventura">Aventura</option>
                <option value="acao">Ação</option>
                <option value="comedia">Comédia</option>
                <option value="suspense">Suspense</option>
                <option value="drama">Drama</option>
                <option value="fantasia">Fantasia</option>
                <option value="ficcao_cientifica">Ficção Científica</option>
                <option value="doramas">Doramas</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sinopse:</label>
            <textarea id="synopsis" placeholder="Preenchido automaticamente..."></textarea>
        </div>

        <div class="form-group">
            <label>URL da Capa (Poster Vertical):</label>
            <input type="url" id="poster_url" required placeholder="Preenchido automaticamente...">
        </div>

        <div class="form-group">
            <label>URL do Banner (Fundo Horizontal):</label>
            <input type="url" id="banner_url" placeholder="Preenchido automaticamente...">
        </div>

        <div class="form-group">
            <label>URL do Vídeo (Stream / Bunny.net / MP4 / .m3u8):</label>
            <input type="url" id="video_url" required placeholder="Cole o link direto do vídeo">
        </div>

        <button type="submit">Salvar no Banco de Dados (Supabase)</button>
    </form>

    <a href="index.html" class="back-link">← Voltar para o Aplicativo</a>

    <script>
        const SUPABASE_URL = 'https://h7wt5ugpusdueiyzhl7aylx0vjsm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6HvZ91Hz5zow1qSjYUqE8g_VCC0XV-2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Chave de API simples do TMDB (100% compatível com navegadores mobile e GitHub Pages)
        const TMDB_API_KEY = 'c737556f37f4666f688f729d70a7af';

        async function buscarNoTMDB() {
            const query = document.getElementById('title').value;
            if (!query) { 
                alert('Digite o nome do filme/série primeiro!'); 
                return; 
            }

            try {
                const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(query)}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const item = data.results[0];
                    document.getElementById('title').value = item.title || item.name;
                    document.getElementById('synopsis').value = item.overview || 'Sem sinopse disponível.';
                    
                    if (item.poster_path) {
                        document.getElementById('poster_url').value = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
                    } else {
                        document.getElementById('poster_url').value = '';
                    }

                    if (item.backdrop_path) {
                        document.getElementById('banner_url').value = `https://image.tmdb.org/t/p/original${item.backdrop_path}`;
                    } else {
                        document.getElementById('banner_url').value = '';
                    }

                    alert('Sucesso! Dados preenchidos automaticamente.');
                } else {
                    alert('Nenhum resultado encontrado. Tente digitar o nome original (ex: Squid Game, Avatar).');
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão ao buscar no TMDB. Verifique sua internet.');
            }
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const synopsis = document.getElementById('synopsis').value;
            const poster_url = document.getElementById('poster_url').value;
            const banner_url = document.getElementById('banner_url').value;
            const video_url = document.getElementById('video_url').value;

            const { error } = await _supabase.from('contents').insert([{ title, type, category, synopsis, poster_url, banner_url, video_url }]);
            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Conteúdo cadastrado com sucesso!');
                document.getElementById('admin-form').reset();
            }
        });
    </script>
</body>
</html>
