<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - StreamApp Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #141414; color: #fff; padding: 20px; }
        h1 { color: #E50914; margin-bottom: 20px; font-size: 1.8rem; text-align: center; }
        form { background: #1f1f1f; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 1rem; }
        textarea { resize: vertical; height: 80px; }
        button[type="submit"] { background-color: #E50914; color: white; border: none; padding: 14px; width: 100%; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button[type="submit"]:hover { background-color: #f40612; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

    <div style="max-width: 600px; margin: 0 auto;">
        <h1>Painel Admin - Cadastrar Mídia</h1>
    </div>

    <form id="admin-form">
        <div class="form-group">
            <label>Título do Filme, Série ou Dorama:</label>
            <input type="text" id="title" required placeholder="Ex: Os Simpsons, Avatar...">
        </div>

        <div class="form-group">
            <label>Tipo:</label>
            <select id="type">
                <option value="movie">Filme</option>
                <option value="series">Série</option>
                <option value="anime">Anime</option>
                <option value="cartoon">Desenho / Animação</option>
                <option value="dorama">Dorama</option>
            </select>
        </div>

        <div class="form-group">
            <label>Categoria:</label>
            <select id="category">
                <option value="terror">Terror</option>
                <option value="aventura">Aventura</option>
                <option value="acao">Ação</option>
                <option value="comedia">Comédia</option>
                <option value="suspense">Suspense</option>
                <option value="drama">Drama</option>
                <option value="fantasia">Fantasia</option>
                <option value="ficcao_cientifica">Ficção Científica</option>
                <option value="doramas">Doramas</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sinopse:</label>
            <textarea id="synopsis" placeholder="Escreva ou cole a sinopse aqui..."></textarea>
        </div>

        <div class="form-group">
            <label>URL da Capa (Poster Vertical):</label>
            <input type="url" id="poster_url" required placeholder="Cole o link da imagem da capa">
        </div>

        <div class="form-group">
            <label>URL do Banner (Fundo Horizontal - Opcional):</label>
            <input type="url" id="banner_url" placeholder="Cole o link do banner">
        </div>

        <div class="form-group">
            <label>URL do Vídeo (Stream / MP4 / .m3u8):</label>
            <input type="url" id="video_url" required placeholder="Cole o link direto do vídeo">
        </div>

        <button type="submit">Salvar no Aplicativo</button>
    </form>

    <a href="index.html" class="back-link">← Voltar para o Aplicativo</a>

    <script>
        const SUPABASE_URL = 'https://h7wt5ugpusdueiyzhl7aylx0vjsm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6HvZ91Hz5zow1qSjYUqE8g_VCC0XV-2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const synopsis = document.getElementById('synopsis').value;
            const poster_url = document.getElementById('poster_url').value;
            const banner_url = document.getElementById('banner_url').value;
            const video_url = document.getElementById('video_url').value;

            const { error } = await _supabase.from('contents').insert([
                { title, type, category, synopsis, poster_url, banner_url, video_url }
            ]);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Cadastrado com sucesso! Já aparece no seu app.');
                document.getElementById('admin-form').reset();
            }
        });
    </script>
</body>
</html>
